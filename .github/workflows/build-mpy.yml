name: Build MicroPython .mpy

on:
  push:
    branches: ["main"]
    paths:
      - "MicroPython/**/*.py"
      - "!MicroPython/mpy/**"

  # Manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mpy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ".github/requirements-ci.txt"

      - name: Install mpy-cross
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-ci.txt
          mpy-cross --version

      - name: Compile .py -> .mpy into MicroPython/mpy
        shell: bash
        run: |
          set -euo pipefail

          SRC_DIR="MicroPython"
          OUT_DIR="MicroPython/mpy"
          mkdir -p "${OUT_DIR}"

          while IFS= read -r -d '' f; do
            rel="${f#${SRC_DIR}/}"
            out="${OUT_DIR}/${rel%.py}.mpy"
            mkdir -p "$(dirname "$out")"
            mpy-cross -O2 -o "$out" "$f"
          done < <(find "${SRC_DIR}" \
                    -type f -name '*.py' \
                    -not -path "${OUT_DIR}/*" \
                    -print0)

      - name: Commit and push generated .mpy (if changed)
        shell: bash
        run: |
          set -euo pipefail

          git add MicroPython/mpy

          if git diff --cached --quiet; then
            echo "No .mpy changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Auto-generate .mpy files"
          git push

