# Workflow designed by ChatGPT 5.2 and slightly tweaked by Spluttflob.
# 2025-Jan-29

name: Build MicroPython .mpy

on:
  push:
    branches: ["main"]
    paths:
      - "MicroPython/**/*.py"
    paths-ignore:
      - "MicroPython/mpy/**"

permissions:
  contents: write

concurrency:
  group: mpy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mpy:
    # Don't run if this push was made by the Actions bot
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install mpy-cross (recent)
        run: |
          python -m pip install --upgrade pip
          pip install mpy-cross
          mpy-cross --version

      - name: Compile .py -> .mpy into MicroPython/mpy
        shell: bash
        run: |
          set -euo pipefail

          SRC_DIR="MicroPython"
          OUT_DIR="MicroPython/mpy"
          mkdir -p "${OUT_DIR}"

          # Compile every .py under MicroPython, excluding output directory
          while IFS= read -r -d '' f; do
            rel="${f#${SRC_DIR}/}"            # relative to MicroPython/
            out="${OUT_DIR}/${rel%.py}.mpy"   # MicroPython/mpy/<same path>.mpy
            mkdir -p "$(dirname "$out")"

            # Adjust optimization level as desired: -O0/-O1/-O2/-O3
            mpy-cross -O2 -o "$out" "$f"
          done < <(find "${SRC_DIR}" \
                    -type f -name '*.py' \
                    -not -path "${OUT_DIR}/*" \
                    -print0)

      - name: Commit and push generated .mpy (if changed)
        shell: bash
        run: |
          set -euo pipefail

          git add MicroPython/mpy

          # If nothing staged, exit cleanly
          if git diff --cached --quiet; then
            echo "No .mpy changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Auto-generate .mpy files"
          git push

